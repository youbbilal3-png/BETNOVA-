name: BETNOVA Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETNOVA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure mandatory-update policy with GitHub Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
            VERSION="${TAG#v}"
            node - "$VERSION" "$TAG" <<'NODE'
          const fs = require('node:fs')
          const path = 'public/app-version.json'
          const policy = JSON.parse(fs.readFileSync(path, 'utf8'))
          const version = process.argv[2]
          const tag = process.argv[3]
          if (!/^\d+\.\d+(?:\.\d+)?$/.test(version)) throw new Error('Invalid latest release tag')
          policy.latestVersion = version
          policy.minimumSupportedVersion = version
          policy.downloadUrl = 'https://github.com/youbbilal3-png/BETNOVA-/releases/download/' + tag + '/app-release.apk'
          fs.writeFileSync(path, JSON.stringify(policy, null, 2) + '\n')
          NODE
          fi

      - name: Build BETNOVA
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BETNOVA }}
          projectId: betnova-8daa3
          channelId: live

      - name: Verify deployed update policy and signed APK download
        run: |
          curl -fsSL https://betnova-8daa3.web.app/app-version.json -o /tmp/betnova-app-version.json
          node -e "const p=require('/tmp/betnova-app-version.json');if(!p.latestVersion||p.minimumSupportedVersion!==p.latestVersion||!p.downloadUrl.endsWith('/app-release.apk'))process.exit(1);console.log('Update policy verified:',p.latestVersion)"
          APK_URL=$(node -p "require('/tmp/betnova-app-version.json').downloadUrl")
          curl -fLsS "$APK_URL" -o /tmp/betnova-release.apk
          test -s /tmp/betnova-release.apk
          unzip -t /tmp/betnova-release.apk >/dev/null
          echo "Signed APK download verified"

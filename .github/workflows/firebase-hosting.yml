name: BETNOVA Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETNOVA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build BETNOVA
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BETNOVA }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

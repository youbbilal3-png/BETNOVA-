name: BETNOVA Android APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build a signed release APK (requires Android signing secrets)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
      - feature/android-capacitor-foundation
      - feature/push-notification-delivery
      - firebase/android-config
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: betnova-android-build
  cancel-in-progress: true

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETNOVA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check live and notification Edge Functions
        run: |
          deno check supabase/functions/live-event-ingest/index.ts
          deno check supabase/functions/sportsapi-live-sync/index.ts
          deno check supabase/functions/fivedollar-football-sync/index.ts
          deno check supabase/functions/dispatch-push-notifications/index.ts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version from update policy
        run: node scripts/set-android-version.mjs

      - name: Require main branch for signed release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Configure release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          cp scripts/android-release-signing.gradle android/app/release-signing.gradle
          printf "\\napply from: 'release-signing.gradle'\\n" >> android/app/build.gradle
        shell: bash

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BETNOVA-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f app/release.keystore' EXIT
          ./gradlew assembleRelease

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: BETNOVA-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

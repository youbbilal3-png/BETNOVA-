name: BETNOVA Android APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build a signed release APK (requires Android signing secrets)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - 'deno.json'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
      - feature/android-capacitor-foundation
      - feature/push-notification-delivery
      - firebase/android-config
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - 'deno.json'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: betnova-android-build
  cancel-in-progress: true

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETNOVA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Generate Android project
        run: npx cap add android

      - name: Apply official BETNOVA launcher icons
        run: node scripts/configure-android-icons.mjs

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Firebase Cloud Messaging
        run: node scripts/configure-android-firebase.mjs

      - name: Set Android version from update policy
        run: node scripts/set-android-version.mjs

      - name: Require main branch for signed release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Configure release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          cp scripts/android-release-signing.gradle android/app/release-signing.gradle
          printf "\\napply from: 'release-signing.gradle'\\n" >> android/app/build.gradle
        shell: bash

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BETNOVA-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f app/release.keystore' EXIT
          ./gradlew assembleRelease

      - name: Verify signed APK and Android package identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -F "package: name='com.betnova.app'"

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: BETNOVA-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK as a GitHub Release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('public/app-version.json','utf8')).latestVersion")
          TAG="v$VERSION"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#betnova-latest.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#betnova-latest.apk" --title "BETNOVA $VERSION" --notes "Signed BETNOVA Android release." --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Prepare stable APK URL and mandatory-update policy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('public/app-version.json','utf8')).latestVersion")
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/betnova-latest.apk
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs')
          const path = 'public/app-version.json'
          const policy = JSON.parse(fs.readFileSync(path, 'utf8'))
          const version = process.argv[2]
          if (!/^\d+\.\d+(?:\.\d+)?$/.test(version)) throw new Error('Invalid release version')
          policy.latestVersion = version
          policy.minimumSupportedVersion = version
          policy.downloadUrl = 'https://betnova-8daa3.web.app/downloads/betnova-latest.apk'
          fs.writeFileSync(path, JSON.stringify(policy, null, 2) + '\n')
          NODE

      - name: Rebuild web assets with the published APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Deploy signed APK and update policy to Firebase Hosting
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BETNOVA }}
          projectId: betnova-8daa3
          channelId: live

      - name: Verify stable APK download and mandatory-update policy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && github.ref == 'refs/heads/main' }}
        run: |
          curl -fsSI https://betnova-8daa3.web.app/downloads/betnova-latest.apk | grep -E '^HTTP/.* 200'
          curl -fsSL https://betnova-8daa3.web.app/app-version.json | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk);process.stdin.on('end',()=>{const policy=JSON.parse(body);if(policy.minimumSupportedVersion!==policy.latestVersion||policy.downloadUrl!=='https://betnova-8daa3.web.app/downloads/betnova-latest.apk')process.exit(1)})"

name: BETNOVA Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
      - feature/android-capacitor-foundation
      - feature/push-notification-delivery
      - firebase/android-config
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: betnova-android-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BETNOVA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check live and notification Edge Functions
        run: |
          deno check supabase/functions/live-event-ingest/index.ts
          deno check supabase/functions/sportsapi-live-sync/index.ts
          deno check supabase/functions/fivedollar-football-sync/index.ts
          deno check supabase/functions/dispatch-push-notifications/index.ts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lvhuipkfsdughearjsvy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_31QoDyH3c357Da-yCpI1Cw_DwUb5DBy

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BETNOVA-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

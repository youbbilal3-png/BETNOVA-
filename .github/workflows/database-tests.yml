name: BETNOVA database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This isolated CI job validates the full migration chain without production credentials.
  test-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Run against a clean local database; never link or connect to production.
      - name: Start isolated local Supabase stack and apply migrations
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

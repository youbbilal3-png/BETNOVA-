name: BETNOVA build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check live and notification Edge Functions
        run: |
          deno check --config=deno.json supabase/functions/live-event-ingest/index.ts
          deno check --config=deno.json supabase/functions/sportsapi-live-sync/index.ts
          deno check --config=deno.json supabase/functions/fivedollar-football-sync/index.ts
          deno check --config=deno.json supabase/functions/dispatch-push-notifications/index.ts
          deno check --config=deno.json supabase/functions/submit-earn-proof/index.ts
